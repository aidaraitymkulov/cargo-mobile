name: cargo_mobile
description: "Cargo mobile application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Навигация
  go_router: ^17.2.0

  # Стейт-менеджмент
  flutter_riverpod: ^3.3.0
  riverpod_annotation: ^4.0.0

  # HTTP
  dio: ^5.7.0

  # Безопасное хранилище токенов
  flutter_secure_storage: ^10.3.0

  # WebSocket + STOMP (чат)
  stomp_dart_client: ^3.0.1

  # Push-уведомления
  firebase_core: ^4.9.0
  firebase_messaging: ^16.2.0

  # Кэш картинок
  cached_network_image: ^3.4.0

  # Форматирование дат
  intl: ^0.20.0

  # Бесконечная прокрутка
  infinite_scroll_pagination: ^5.1.0

  # Разрешения (уведомления, камера)
  permission_handler: ^12.0.0

  # Immutable модели
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Кодогенерация
  build_runner: ^2.15.0
  json_serializable: ^6.14.0
  riverpod_generator: ^4.0.0
  freezed: ^3.2.0

flutter:
  uses-material-design: true
